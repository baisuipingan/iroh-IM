name: release-room-bridge

# ============================================================================
#  room-bridge 单文件适配器：构建 → 打包 → 上传到 Release
#
#  触发：打 tag `bridge-v*`（或手动，只构建不发布）
#  产物：room-bridge-<os>-<arch>（windows 带 .exe）+ 逐产物 .sha256
#        安装脚本按 `<asset>.sha256` 逐产物取（见 deploy/install/room-bridge-install.sh）
#
#  为什么全平台都在 ubuntu 上构建：bun 可以交叉编译（--target 显式给目标，
#  脚本里还用 `file` 复核架构）——省掉 6 台 runner 的矩阵和排队。
#  反漂移：release-agent 那边踩过"不传 --target 静默编出错误架构"的坑，
#  所以这里的架构校验不是可选项。
# ============================================================================

on:
  push:
    tags: ['bridge-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建全部平台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 构建（含逐产物 sha256 与 file 架构校验）
        run: bash scripts/build-room-bridge.sh --all

      - name: 冒烟：linux-amd64 真跑一次
        run: ./dist/room-bridge/room-bridge-linux-amd64 --help | head -3

      - name: 生成合并校验和（逐产物 .sha256 必须保留）
        run: |
          set -euo pipefail
          cd dist/room-bridge
          ls -1 ./*.sha256 > /dev/null
          : > SHA256SUMS.txt
          for f in *.sha256; do
            asset="${f%.sha256}"
            printf '%s  %s\n' "$(cat "$f")" "$asset" >> SHA256SUMS.txt
          done
          ls -la
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: room-bridge
          path: dist/room-bridge/*
          if-no-files-found: error

  publish:
    name: 上传到 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/room-bridge-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
