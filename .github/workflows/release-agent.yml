name: release-agent

# ============================================================================
#  iroh-agent 多平台产物：构建 → 打包 → 上传到 Release
#
#  为什么要这个：iroh-agent 是**静态二进制**（只用 libc/libm/libgcc），
#  而 Skill 与一键安装脚本都是「按平台下载对应产物」。没有这一步，
#  下载就没东西可下 —— 所以**发布 Release 是安装链路的一环**，不是可选项。
#
#  触发：
#   - 打 tag：refs/tags/agent-v*
#   - 手动：workflow_dispatch（不传 tag 时只构建、不发布，方便先验证矩阵）
#
#  产物命名（**三处必须一致**）：
#   skills/iroh-agent/scripts/install.{sh,ps1}
#   deploy/install/agent-install.{sh,ps1}
#   本文件的 include
#     iroh-agent-<os>-<arch>.tar.gz     POSIX（macOS / Linux）
#     iroh-agent-windows-<arch>.zip      Windows（PowerShell 5.1 的 Expand-Archive 只认 zip）
# ============================================================================

on:
  push:
    tags: ['agent-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- macOS ----
          - { os: macos-14, target: aarch64-apple-darwin, osname: darwin, arch: arm64, ext: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin,  osname: darwin, arch: amd64, ext: tar.gz }
          # ---- Linux ----
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, osname: linux, arch: amd64, ext: tar.gz, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, osname: linux, arch: arm64, ext: tar.gz, cross: true }
          # ---- Windows ----
          - { os: windows-latest, target: x86_64-pc-windows-msvc, osname: windows, arch: amd64, ext: zip }
          # Windows arm64：没有原生 runner，用 cargo-xwin 在 ubuntu 上交叉编
          # （它会自动下载 CRT/SDK）。这是矩阵里唯一"非原生"的一项，失败不影响其它平台。
          - { os: ubuntu-latest, target: aarch64-pc-windows-msvc, osname: windows, arch: arm64, ext: zip, xwin: true }

    steps:
      - uses: actions/checkout@v4

      # cargo 的版本来自仓库工具链；rustup 已在 runner 上自带
      - name: 装 Rust（${{ matrix.target }}）
        run: rustup target add ${{ matrix.target }}

      - name: Linux arm64 交叉工具链
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> $GITHUB_WORKSPACE/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-C", "target-feature=+crt-static"]
          EOF

      - name: cargo-xwin（Windows 交叉编）
        if: matrix.xwin
        run: cargo install cargo-xwin --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}

      - name: 取依赖（一次性；之后用 --offline 构建）
        working-directory: client-wasm
        run: cargo fetch --locked

      # --offline 是在证明"这份源码闭着眼也能编出来"（依赖全在缓存里）。
      # ⚠️ 仓库里有 [patch.crates-io] iroh-gossip = { path = "vendor/iroh-gossip" }，
      #    所以 vendor/ 必须随仓库提交（它是被跟踪的）。
      - name: 构建（${{ matrix.target }}）
        working-directory: client-wasm
        run: cargo build --release --offline --locked --no-default-features --features cli --bin agent

      - name: 打包 + 校验和
        shell: bash
        # 全程用**绝对路径**：相对路径要靠数 `../` 的层数，而这个脚本里
        # 既 cd 进 target 目录又 cd 回来，改一行层数就错位 —— 这里错过一次，
        # 表现是"打包成功但上传时找不到文件"。
        run: |
          set -euo pipefail
          NAME=iroh-agent
          OUT="$GITHUB_WORKSPACE/client-wasm/out"
          mkdir -p "$OUT"
          REL="$GITHUB_WORKSPACE/client-wasm/target/${{ matrix.target }}/release"

          # ⚠️ cargo --bin agent 产出的文件名是 `agent`，但**四个安装脚本全都按
          #    `iroh-agent` 去找**（$BIN=iroh-agent，asset=iroh-agent-<os>-<arch>.<ext>，
          #    解包后 install "$tmp/$BIN"）。这里不先改名就会：下载 404，
          #    或解包后找不到文件。
          case "${{ matrix.ext }}" in
            zip) EXE="$NAME.exe"; cp "$REL/agent.exe" "$OUT/$EXE" ;;
            *)   EXE="$NAME";     cp "$REL/agent"     "$OUT/$EXE" ;;
          esac

          cd "$OUT"
          ASSET="$NAME-${{ matrix.osname }}-${{ matrix.arch }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = zip ]; then
            zip -q -j "$ASSET" "$EXE"
          else
            chmod 755 "$EXE"
            tar -czf "$ASSET" "$EXE"
          fi
          rm -f "$EXE"

          # 先看一眼包里是什么：名字打错要在这里暴露，而不是等用户装不上
          echo "--- $ASSET 内容 ---"
          case "${{ matrix.ext }}" in
            zip) unzip -l "$ASSET" | head -5 ;;
            *)   tar -tzf "$ASSET" ;;
          esac

          # 同架构产物顺手验一下真能起来；交叉产物只能验格式
          if [ "${{ matrix.osname }}" != windows ]; then
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-gnu|aarch64-apple-darwin|x86_64-apple-darwin)
                tar -xzf "$ASSET"
                ./"$NAME" --help >/dev/null && echo "  ✅ 二进制可执行"
                rm -f "$NAME" ;;
            esac
          fi

          # 校验和：输出格式必须统一成 "<hash>  <file>"，
          # 因为安装脚本用 `cut -d' ' -f1` / `split '\s+'` 解析。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: iroh-agent-${{ matrix.osname }}-${{ matrix.arch }}
          # 与上面 OUT 必须是同一处，否则 if-no-files-found 会让整个 job 失败
          path: client-wasm/out/*
          if-no-files-found: error

  publish:
    name: 上传到 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/agent-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 组装 Release 附件
        run: |
          set -euo pipefail
          cd dist
          # ⚠️ 千万不要删掉每个产物旁边的 .sha256！
          #    安装脚本是按 `<asset>.sha256` 这个**逐产物**的 URL 去取的
          #    （见 skills/iroh-agent/scripts/install.sh 的 `$BASE_URL/$ASSET.sha256`），
          #    删掉它们不会报错，只会让校验静默退化成"没拿到 .sha256，跳过校验" ——
          #    看起来一切正常，实际供应链校验从来没生效过。
          #    这里只**额外**生成一份合并清单，不在文件本身的命名上做合并。
          ls -1 ./*.sha256 > /dev/null   # 先确认确实有（没有就是打包步骤出了问题）
          cat ./*.sha256 > SHA256SUMS.txt
          echo "--- 目录内容 ---"
          ls -la
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iroh-agent-*
            dist/SHA256SUMS.txt
          generate_release_notes: true