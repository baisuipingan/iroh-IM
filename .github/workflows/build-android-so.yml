# 编 Android 原生库（libiroh_web.so）并发布到 Release
#
# ## 为什么单独一个 workflow
#
# Rust 交叉编译到 Android **必须有 NDK 的 clang**（`ring` 的 C 代码要编译）。
# 本机不一定有 NDK，而且编一次要十几分钟 —— 不适合放在开发者的日常循环里。
# 交给 CI：编一次、产物进 Release、所有开发者直接下载，还能被缓存复用。
#
# ## 产物怎么用
#
# 下载后放进本地模块的 jniLibs：
#
#     mobile/modules/iroh-native/android/src/main/jniLibs/arm64-v8a/libiroh_web.so
#
# 然后 `npx expo prebuild` + `npx expo run:android`（或 EAS Build）。
# 安装脚本见 scripts/fetch-android-so.sh。
#
# ## ABI 说明
#
# 只出 **arm64-v8a**：真机全是 arm64，模拟器在 Apple Silicon 上也是 arm64。
# x86_64 模拟器（Intel Mac / CI）需要额外产一个 ABI，会显著拉长构建时间 ——
# 等真有人需要再加（那时矩阵里加一行即可，脚本支持多 ABI）。

name: build-android-so

# 触发方式刻意保持**简单明确**：
#   - 打 `android-v*` tag = 明确要出产物
#   - 或手动 workflow_dispatch（调试用）
#
# ⚠️ 为什么不加 `branches` + `paths` 过滤：
#    同时写 `tags` 和 `paths` 时，paths 是否对 tag push 生效在不同
#    GitHub 版本/文档表述里有歧义 —— 一旦被判为"不匹配"，
#    打 tag 后 workflow **静默不触发**（不报错，你以为在跑其实没有）。
#    所以这里零过滤。要省 CI 额度就用手动触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  check-symbols:
    name: 校验 JNI 符号名
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 这一步**先于编译**跑。JNI 符号名（包/类/方法）对不上时
      #    编得再成功，也是装到手机上才崩 UnsatisfiedLinkError，
      #    而报错只说"找不到 xxx"、不说是名字拼错了。
      #    在新的 .so 上浪费一整轮构建之前先拦住它 —— 几秒钟。
      - name: 检查 Rust ↔ Kotlin 符号一致
        run: node scripts/check-jni-symbols.mjs

  build:
    name: 构建 ${{ matrix.abi }}
    needs: check-symbols
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            ndk_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust target
        run: rustup target add ${{ matrix.target }}

      - name: 装 NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          # r27 LTS：与 iroh/ring 的构建要求兼容；r28+ 换掉了部分 API
          ndk-version: r27c
          add-to-path: false

      # ⚠️ 必须显式告诉 cargo 用 NDK 的 clang，否则 ring 的 build script 会去找
      #    `aarch64-linux-android-clang`（PATH 里没有）然后失败：
      #      failed to run custom build command for `ring v0.17.14`
      #    cc-rs 认这两种环境变量名（带下划线/带连字符都会读），这里给全。
      - name: 配置交叉编译工具链
        shell: bash
        run: |
          set -euo pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"
          ls "$TOOLCHAIN/bin" | grep -E "aarch64-linux-android[0-9]+-clang$" | head -3

          AR="$TOOLCHAIN/bin/llvm-ar"
          CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"

          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC"
            echo "CC_aarch64-linux-android=$CC"
            echo "AR_aarch64-linux-android=$AR"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$AR"
            # ★ 打包脚本靠它找到 NDK 自带的 llvm-strip。
            #   ⚠️ 不设的话，`command -v strip` 会命中 ubuntu 自带的 GNU strip ——
            #   那个**读不了 ARM ELF**，报 "Unable to recognise the format"，
            #   而报错本身看不出是"拿错工具"（真实翻过车，见 pack 脚本注释）。
            echo "ANDROID_NDK_HOME=$NDK"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}

      # ⚠️⚠️ `cargo fetch` **没有 feature 参数**（只有 --target），它按
      #    "默认 feature" 解析依赖 —— 而 build 用的是
      #    `--no-default-features --features "cli jni-bridge"`，两者依赖集不同。
      #    实测后果：build 阶段报
      #        error: failed to download `curve25519-dalek-derive v0.1.1`
      #        attempting to make an HTTP request, but --offline was specified
      #    34 秒就红，一行代码都没编。（curve25519-dalek v5 的 proc-macro 依赖，
      #    只有非 wasm 目标才会真正用到。）
      #
      #    所以这里**不传 --target**，让 fetch 覆盖最宽的集合
      #    （含宿主机 + 各 target 的条件依赖）。
      - name: 预拉依赖（--locked 保证版本可复现）
        working-directory: client-wasm
        run: cargo fetch --locked

      # ⚠️ 四个关键点：
      #   1. `--target` 必须显式传，否则产物落在 target/release/ 且
      #      **架构是宿主机的**（x86_64）—— 打出来的包在 arm64 上跑不起来
      #   2. `--features cli` 是必须的：room.rs 依赖它的 tokio/signal 等
      #   3. ★ `--features jni-bridge` **也必须在**：`jni` 是 optional 依赖，
      #      不显式打开的话 `src/jni_api.rs` 的 `use jni::…` 会直接编译失败。
      #      模块虽由 `cfg(any(target_os="android", feature="jni-bridge"))` 门控，
      #      Android target 确实会**编译**它，但那个 optional 依赖不会自动跟着开。
      #   4. `--lib` 只编 cdylib：agent 二进制与本产物无关，编它纯属浪费
      #   5. ★ **不要加 `--offline`**：`cargo fetch` 无法按 feature 解析依赖
      #      （见上一段的说明），所以构建时按需联网补齐才是可靠的做法。
      #      可复现性由 `--locked` 保证（依赖版本一个都不许变），
      #      这才是真正要紧的那一条 —— `--offline` 只是"省一次网络检查"。
      - name: 构建 .so
        working-directory: client-wasm
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --no-default-features --features "cli jni-bridge" \
            --lib \
            --target ${{ matrix.target }}

      - name: 打包 + 校验和
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci/pack-android-so.sh

      # ★ 校验**产物**里的 JNI 符号（不是源码）。
      #
      # 与前面「校验 JNI 符号名」的分工：那一步对的是**源码清单**
      # （Rust 导出名 ↔ Kotlin external fun），这一步对的是**编出来的 .so**。
      # 有些错只在产物里才暴露：
      #   · 忘了 #[no_mangle] → 符号被 mangle
      #   · strip 用了 --strip-all → 动态符号表被整个删掉
      #   · crate-type / target 不对 → 编出来的不是我们要的那个 .so
      #   · LTO 把"看起来没人调用"的导出函数优化掉
      # 这几类一旦漏了，症状都是机上 UnsatisfiedLinkError —— 最难查的一种。
      # 在**上传之前**拦住，成本只有几秒。
      - name: 校验产物里的 JNI 符号
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          SO="client-wasm/out-android/libiroh_web-$ABI.so"
          # macOS 的 nm 读不了 ELF，所以显式用 NDK 自带的 llvm-nm
          export PATH="$(dirname "$(find "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt" -maxdepth 3 -name llvm-nm -type f | head -1)"):$PATH"
          node scripts/verify-so-symbols.mjs "$SO"

      - uses: actions/upload-artifact@v4
        with:
          name: libiroh_web-${{ matrix.abi }}
          path: client-wasm/out-android/*
          # 与上面的输出目录必须是同一处，否则 if-no-files-found 会让 job 失败
          if-no-files-found: error

  publish:
    name: 上传到 Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android-v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          # ⚠️ 保留 .sha256 —— 下载脚本按 `<file>.sha256` 校验。
          #    删掉不会报错，只会让校验静默退化成"跳过"，供应链校验等于没有。
          files: dist/*
          fail_on_unmatched_files: true
