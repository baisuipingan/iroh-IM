# iroh 聊天室 · 前端站点
#
# 为什么用 Worker + Static Assets 而不是 Pages：
#   Pages 没有 CLI 绑定自定义域名的命令（要去 dashboard 点），
#   而 Worker 的 `routes: [{ custom_domain = true }]` 能让 wrangler
#   **自动创建 DNS 记录 + 签发证书**，一条命令从零到可访问。
#   本站是纯静态资源，不需要任何 Worker 逻辑，assets 就够了。
#
# 部署：bash scripts/deploy-web.sh
# 预览：npx wrangler dev（本地起一个等价环境）

name = "iroh-chatroom"
compatibility_date = "2026-10-01"

# 只走自定义域名，不额外暴露 <name>.<subdomain>.workers.dev
workers_dev = false

# 纯静态：直接把 dist/site 当站点资源发布（不需要 main 入口脚本）
assets = { directory = "dist/site" }

# custom_domain = true → wrangler 自动建 DNS + 证书，不用去控制台手动加解析
#
# ⚠️ 换域名时的正确顺序：**先并存、验证通了、再摘旧的**。
#    新域名的证书要 1~2 分钟签发，先并存能保证这期间站点一直可访问。
#    （2026-10-04 从 im.editor.vip 迁到 im.pinkstar.cc 就是照这个顺序做的：
#     先两条 route 一起部署 → 确认新域名 200 + 证书有效 → 再删掉旧的那条。）
#
# 域名变更史：
#   2026-09-29 ~ 2026-10-04  im.editor.vip（cloudflare-skills 那个仓库的临时域名）
#   2026-10-04 ~             im.pinkstar.cc（用户自购）
routes = [{ pattern = "im.pinkstar.cc", custom_domain = true }]
