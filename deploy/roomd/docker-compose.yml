# roomd · 常驻节点（房间锚点：历史消息 + 在线状态）
#
# 与中继的关系：它是**客户端**，不监听端口、不开防火墙，自己连中继。
# 所以用默认 bridge 网络即可，不需要 network_mode: host。
#
# 部署：
#   1) 把编译好的 roomd 二进制放到本目录（build-wasm.sh 的 native 产物）
#   2) docker compose up -d --build
#   3) docker compose logs | grep ROOMD_ENDPOINT_ID   → 把它写进前端 relay-config.json 的 anchor.id

services:
  roomd:
    build: .
    image: roomd:local
    container_name: roomd
    restart: unless-stopped

    # ========================================================================
    # ★ 健康检查 —— **没有它，roomd 会"假活"**
    #
    # ## 为什么要这个（2026-10-10 真事）
    #
    # 服务器重启（内核升级）后，roomd 容器跟着起来了，
    # 但**它到中继的 TCP 一直卡在 SYN_SENT** —— 进程活着、日志一行不写、
    # CPU 0.04%，整整 **8.7 小时**什么都没做。
    #
    # `restart: unless-stopped` 只管「进程死了拉起来」，
    # **对"进程活着但网络废了"完全无感**。于是所有客户端都连不上锚点，
    # 而服务端看起来一切正常（容器 Up、中继 Up、端口在听）。
    #
    # ## 判据：到中继的 TCP 是否 ESTABLISHED
    #
    # roomd 是**纯客户端**（它连中继，不监听任何端口），
    # 所以"有没有一条对外建的连接"就是它活着的直接证据。
    # 卡住时那条连接会停在 SYN_SENT（st=02），不是 01。
    #
    # ⚠️ 为什么读 `/proc/net/tcp` 而不是 `nc`/`curl`：
    #    这个镜像是 `debian:bookworm-slim` + 只装了 ca-certificates，
    #    **没有 nc / curl / wget**（实测）。`cat` 和 `grep` 一定有
    #    （busybox/coreutils 都有），而且读 /proc **不需要装任何东西**。
    #
    # ⚠️ `3C53` = 15443 的十六进制（/proc/net/tcp 用大写十六进制端口）。
    #    `01` = TCP_ESTABLISHED。两者都要匹配，避免把 SYN_SENT 也算通过。
    #
    # 时间参数：每 30s 一次、连续 3 次失败才判不健康（约 90s 容忍），
    # 启动给 60s 宽限（它要先连中继、订阅房间）。
    # 判不健康后 Docker **不会自动重启**（restart 策略只管进程退出），
    # 所以配了看门狗：roomd-watchdog.sh + .service + .timer（同目录）。
    # ========================================================================
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          grep -qE '^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-F]{8}:[0-9A-F]{4}[[:space:]]+[0-9A-F]{8}:3C53[[:space:]]+01'
          /proc/net/tcp
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data          # 身份 + 历史都在这里，务必保留
    environment:
      # 用哪几台中继（逗号分隔）
      - ROOMD_RELAYS=${ROOMD_RELAYS:-https://iroh1.editor.vip:15443,https://iroh2.editor.vip:15443,https://iroh3.editor.vip:15443}
      # 启动时自动订阅的房间（其余房间在第一次有人要历史时自动订阅）
      - ROOMD_ROOMS=${ROOMD_ROOMS:-lobby}
      - ROOMD_NICKNAME=${ROOMD_NICKNAME:-常驻节点}
      # 中继开启鉴权后必须提供（否则会被中继拒：The relay denied our authentication）
      - ROOMD_RELAY_TOKEN=${ROOMD_RELAY_TOKEN:-}
      # 不要硬编码，否则会覆盖 .env 里的 RUST_LOG（排查时看不到 iroh 内部日志）
      - RUST_LOG=${RUST_LOG:-info}
