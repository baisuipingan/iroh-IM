<!DOCTYPE html>
<!-- ⚠️ `data-theme` 由下面的内联脚本**在 CSS 之前**写入。
     不要在这里硬编码 `data-theme="dark"` —— 那会让首屏**必然先渲染深色**，
     然后等 JS 跑完再切到浅色（用户看到"闪一下"）。
     内联脚本是同步阻塞的，所以浏览器还没画第一帧就已经定好了主题。

     ⚠️ 字体：设计稿用的是 Google Fonts 的 Nunito Sans。本产品面向中文用户、
     部署在 Cloudflare 上，**故意不引那个 CDN**（国内会超时 → 首屏白字）。
     css/tokens.css 里写了 `'Nunito Sans'` + 系统中文栈，谁自托管谁生效。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>派大星聊天室</title>
  <meta name="theme-color" content="#0e2439" />

  <!-- 主题预置（**必须放在所有 CSS 之前**，也必须是同步内联的）-------
       干两件事：
         1. 读出用户的主题偏好（dark / light / auto）
         2. 在浏览器绘制第一帧之前把 `data-theme` 定下来
       为什么不能等 main.js：那要加载 wasm，几百毫秒后才会执行 ——
       这期间页面已经用默认主题画完了，切主题时就会闪。
       ⚠️ 这里读的 key 必须与 store.js 的 KEYS.theme 保持一致（`iroh.theme`）。 -->
  <script>
    (() => {
      const THEME_KEY = 'iroh.theme';
      let pref = 'auto';        // 默认跟随系统（老用户读到自己存的值）
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark' || saved === 'light' || saved === 'auto') pref = saved;
      } catch { /* 隐私模式 / 存储被禁 → 用默认 auto */ }
      const dark = pref === 'dark' ||
        (pref === 'auto' && window.matchMedia &&
         window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      // 把偏好也挂到 dataset（便于调试）。
      // ⚠️ 属性名**不能**叫 `data-theme-pref` —— 设置页里那个 `<select>`
      //    用的就是这个属性名，`document.querySelector('[data-theme-pref]')`
      //    会先匹配到 `<html>`（踩过：拿到 HTML 元素当 select 用）。
      document.documentElement.dataset.themeSetting = pref;
    })();
  </script>

  <!-- 站点图标（浏览器标签页 / 收藏夹 / 添加到桌面）。
       `logo.png` 是从 `派大星/generated-image-1 (1)_副本.png` 裁边补方后量化的 192×192 版本
       （原图 1229×1280、5 万多种颜色，直接用会有 300+ KB）。 -->
  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />

  <!-- 三层样式：令牌 → 布局 → 组件 -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
<!--
  结构说明（对齐设计稿的三栏桌面 IM 架构）：
    .app 三栏 grid
      .rail            最左 64px 深海蓝导航栏（头像 / 聊天 / 成员 / 状态 / 设置）
      .panel           300px 半透明海沫列表（搜索 / 筛选 chips / 列表 / 状态条）
      .chat            对话舱
        .ambient       环境气泡层（纯装饰，pointer-events:none）
        .chat-head     56px 顶栏（房间名 / 成员药丸 / 在线药丸 / 快捷操作）
        .blank         未进房时的落地页
        .timeline      唯一可滚动区域（.timeline-inner 装内容）
        .jump-btn      回到最新
        .composer      底部输入起草台 + 真实连接页脚
  每个可滚动祖先都有 min-height:0（见 css/layout.css 的注释）。
-->
<div class="app">

  <!-- ==================== 最左图标栏（64px） ==================== -->
  <nav class="rail">
    <div class="rail__me" id="rail-me" title="我的身份"><span id="rail-initial">·</span><span class="rail__badge" id="rail-badge"></span></div>

    <button class="rail-btn is-active" id="tab-chats" title="聊天" type="button" aria-label="聊天">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.3-.6L3 21l1.8-5a8 8 0 0 1-.8-3.6 8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8 7.5Z"/>
      </svg>
    </button>

    <button class="rail-btn" id="tab-status" title="连接与成员" type="button" aria-label="连接与成员">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
      </svg>
    </button>

    <button class="rail-btn" id="tab-settings" title="设置" type="button" aria-label="设置">
      <!-- 圆形齿轮：8 个齿是**轮廓的一部分**（不是分开的放射线），
           否则看起来像太阳/罗盘。中心小圆是轴孔。
           前两版分别是非规则多边形齿轮、放射线齿轮，都不像"设置"。 -->
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M18.9 14.3a1.4 1.4 0 0 0 .3 1.6l.1.1a1.7 1.7 0 1 1-2.4 2.4l-.1-.1a1.4 1.4 0 0 0-1.6-.3 1.4 1.4 0 0 0-.9 1.3v.3a1.7 1.7 0 1 1-3.4 0v-.2a1.4 1.4 0 0 0-.9-1.3 1.4 1.4 0 0 0-1.6.3l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.4 1.4 0 0 0 .3-1.6 1.4 1.4 0 0 0-1.3-.9h-.3a1.7 1.7 0 1 1 0-3.4h.2a1.4 1.4 0 0 0 1.3-.9 1.4 1.4 0 0 0-.3-1.6l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.4 1.4 0 0 0 1.6.3h.1a1.4 1.4 0 0 0 .9-1.3v-.3a1.7 1.7 0 1 1 3.4 0v.2a1.4 1.4 0 0 0 .9 1.3 1.4 1.4 0 0 0 1.6-.3l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.4 1.4 0 0 0-.3 1.6v.1a1.4 1.4 0 0 0 1.3.9h.3a1.7 1.7 0 1 1 0 3.4h-.2a1.4 1.4 0 0 0-1.3.9z"/>
      </svg>
    </button>

    <div class="rail__spacer"></div>

    <button class="rail-btn" id="btn-probe" title="重新探测中继" type="button" aria-label="重新探测中继">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>
      </svg>
    </button>
  </nav>

  <!-- 移动端：面板是覆盖层，点这层把它关掉 -->
  <div class="panel-scrim" id="panel-scrim"></div>

  <!-- ==================== 列表（300px） ==================== -->
  <aside class="panel" id="panel">
    <div class="panel-head">
      <div class="search">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="filter" placeholder="搜索房间…" aria-label="搜索房间" />
      </div>
      <button class="icon-btn" id="btn-new" title="新建房间" type="button" aria-label="新建房间">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="切换深色 / 浅色" type="button" aria-label="切换深色或浅色">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>

    <!-- 房间筛选（设计稿："全部 / 群组 / 密友"位）。
         ⚠️ 现有数据模型**没有**群组/密友的分组字段，所以这里用真实存在的
         三个维度：全部 / 置顶（store.room.pinned）/ 未读（sidebar.unread）。
         想要设计稿那套分组，得先给房间加一个分组字段（见改造报告）。 -->
    <div class="panel-tabs" id="panel-tabs">
      <button class="tab-chip is-on" data-filter="all" type="button">全部</button>
      <button class="tab-chip" data-filter="pinned" type="button">置顶</button>
      <span class="panel-tabs__link" id="channel-link" title="节点连接状态">
        <span class="radar-ring" id="channel-dot"></span>
        <span id="channel-text">连接中</span>
      </span>
    </div>

    <div class="panel-scroll" id="panel-body"></div>

    <!-- 面板底部：真实中继信息（设计稿"太平洋深海 3000m 专线"位） -->
    <div class="panel-foot" id="panel-foot">
      <div class="panel-foot__left">
        <span class="radar-ring" id="panel-foot-dot"></span>
        <span class="panel-foot__text" id="panel-foot-text">正在接入中继…</span>
      </div>
      <span class="panel-foot__ver" id="panel-foot-ver">iroh</span>
    </div>
  </aside>

  <!-- ==================== 对话舱 ==================== -->
  <main class="chat">
    <!-- 环境气泡层（设计稿 floatUp，由 js/ui/motion.js 填充） -->
    <div class="ambient" id="ambient" aria-hidden="true"></div>
    <!-- 中央水滴形水印 -->
    <div class="chat-watermark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2.6s6.4 7.2 6.4 11.6a6.4 6.4 0 1 1-12.8 0C5.6 9.8 12 2.6 12 2.6Z"/>
      </svg>
    </div>

    <header class="chat-head">
      <!-- 顶栏结构对齐设计稿 _1：房间号徽标 + 标题 + 成员药丸，下面一行真实连接信息。
           徽标只在"备注名 ≠ 房间名"时出现 —— 没有备注名时它和标题一模一样，
           显示两遍同一个名字纯属占地方。 -->
      <div class="chat-head__id">
        <div class="chat-head__badge" id="room-badge" hidden></div>
        <div class="chat-head__meta">
          <div class="chat-head__row">
            <h1 class="chat-head__title" id="room-title" title="点击可改备注名">未进入房间</h1>
            <button class="chat-head__members" id="room-members" title="查看房间成员" type="button" hidden>
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/>
                <circle cx="9" cy="7.5" r="3.5"/>
                <path d="M22 20v-1.5a4 4 0 0 0-3-3.87"/>
              </svg>
              <span id="room-members-text">0 人</span>
            </button>
          </div>
          <div class="chat-head__subline" id="chat-subline"><i></i><span id="chat-subline-text">正在连接中继…</span></div>
        </div>
      </div>

      <div class="chat-head__spacer"></div>

      <!-- 视图切换（设计稿 _1 的「消息对话 / 声呐拓扑」）。
           内容换成真实量，名字叫「中继拓扑」而不是「声呐拓扑」——
           我们没有声呐数据，画出来只能是编的。 -->
      <div class="chat-head__tabs" id="view-tabs" role="tablist">
        <button class="view-tab is-on" data-view="chat" role="tab" aria-selected="true" type="button">消息对话</button>
        <button class="view-tab" data-view="topology" role="tab" aria-selected="false" type="button">中继拓扑</button>
      </div>

      <span class="pill" id="node-pill">
        <i class="pill__dot"></i><span class="pill__text">启动中</span>
      </span>

      <div class="chat-head__actions">
        <!-- 提示音开关（真实偏好 store.prefs().sound） -->
        <button class="head-btn" id="btn-head-sound" title="新消息提示音" type="button" aria-label="新消息提示音">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6.5 8.6H3v6.8h3.5L11 19Z"/><path d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4"/><path d="M18.4 5.9a8.6 8.6 0 0 1 0 12.2"/>
          </svg>
        </button>
        <!-- 加密说明（端到端确实成立，点开讲清楚边界） -->
        <button class="head-btn" id="btn-head-lock" title="加密与隐私说明" type="button" aria-label="加密与隐私说明">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
          </svg>
        </button>
        <!-- 房间菜单（备注名 / 置顶 / 移出） -->
        <button class="head-btn" id="btn-room-menu" title="房间设置" type="button" aria-label="房间设置">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="5.5" cy="12" r="1.3" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
            <circle cx="18.5" cy="12" r="1.3" fill="currentColor" stroke="none"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="blank" id="blank">
      <img class="blank__logo" src="./logo.png" alt="派大星聊天室" />
      <div>
        选择一个房间开始聊天<br />
        <small>或点列表右上角的 + 新建一个房间</small>
      </div>
    </div>

    <div class="timeline" id="timeline" style="display:none">
      <div class="timeline-inner" id="tl-inner"><div class="tl-hint" id="tl-hint"></div></div>
    </div>

    <button class="jump-btn" id="jump-btn" type="button">回到最新</button>

    <!-- 中继拓扑（设计稿 _1 的「声呐拓扑」位）。
         ⚠️ 用**覆盖层**而不是把时间线/输入区 display:none ——
            那两个元素的可见性由 timeline.open()/close() 直接写内联样式控制，
            这里再去改就会两处打架（切房间后拓扑页会自己消失或闪现）。 -->
    <section class="topology" id="topology" aria-label="中继拓扑" aria-hidden="true"></section>

    <footer class="composer" id="composer" style="display:none">
      <div class="emoji-pop" id="emoji-pop"></div>

      <!-- 拖拽到窗口任意位置时的提示层 -->
      <div class="dropzone" id="dropzone">
        <div class="dropzone__inner">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>
          </svg>
          <div class="dropzone__text">松开即可添加到待发送</div>
        </div>
      </div>

      <div class="composer__box">
        <!-- 待发送区：粘贴/拖拽/选择的文件先落在这里，可逐个移除（微信模式） -->
        <div class="pending" id="pending"></div>

        <textarea class="composer__input" id="input" rows="1"
                  placeholder="输入消息，Enter 发送 · Shift+Enter 换行"></textarea>

        <div class="composer__tools">
          <button class="tool-btn" id="tb-emoji" title="表情" type="button" aria-label="表情">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>
            </svg>
          </button>
          <button class="tool-btn" id="tb-file" title="发送文件" type="button" aria-label="发送文件">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l2 2.5h7.8A2.5 2.5 0 0 1 21 10v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17Z"/>
            </svg>
          </button>
          <button class="tool-btn" id="tb-shot" title="发送图片" type="button" aria-label="发送图片">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
              <circle cx="8.5" cy="10" r="1.8"/>
              <path d="m4 17 4.5-4.5a2 2 0 0 1 2.8 0L15 16l2-2a2 2 0 0 1 2.8 0L21 15.2"/>
            </svg>
          </button>
          <button class="tool-btn" id="tb-voice" title="语音消息尚未支持" type="button" aria-label="语音消息尚未支持">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>
            </svg>
          </button>
          <div class="composer__spacer"></div>
          <span class="composer__tip" id="composer-tip"></span>
          <button class="btn-primary" id="send" type="button" disabled>发送</button>
        </div>
      </div>

      <!-- 输入区页脚：设计稿"声纳频段 / 深度压强"位，换成真实的连接信息 -->
      <div class="conn-foot">
        <div class="conn-foot__left">
          <span class="conn-foot__dot" id="conn-foot-dot"></span>
          <span class="conn-foot__text" id="conn-foot-text">正在接入中继…</span>
        </div>
        <span class="conn-foot__right">端到端加密 · relay-only</span>
      </div>

      <input type="file" id="file" multiple style="display:none" />
      <input type="file" id="file-img" accept="image/*" multiple style="display:none" />
    </footer>
  </main>
</div>

<!-- 通用对话框 -->
<div class="modal" id="modal">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" tabindex="-1">
    <h3 class="dialog__title" id="dlg-title">标题</h3>
    <div class="dialog__body" id="dlg-body"></div>
    <div class="dialog__actions">
      <button class="btn-ghost" id="dlg-cancel" type="button">取消</button>
      <button class="btn-primary" id="dlg-ok" type="button">确定</button>
    </div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
