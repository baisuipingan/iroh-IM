[package]
name = "iroh-web"
version = "0.1.0"
edition = "2021"
description = "Browser (wasm) + native iroh endpoint for the editor.vip self-hosted relay fleet"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "relay-probe"
path = "src/bin/relay_probe.rs"
required-features = ["cli"]

[[bin]]
name = "filetest"
path = "src/bin/filetest.rs"
required-features = ["cli"]

[[bin]]
name = "roomtest"
path = "src/bin/roomtest.rs"
required-features = ["cli"]

[[bin]]
name = "roomd"
path = "src/bin/roomd.rs"
required-features = ["cli"]

# 无头命令行客户端：让没有浏览器/Node 的机器（CI、agent）也能作为成员进房收发。
[[bin]]
name = "agent"
path = "src/bin/agent.rs"
required-features = ["cli"]

[features]
# 默认构建 wasm（wasm-pack 用默认 feature）
default = ["wasm"]
wasm = [
  "dep:console_error_panic_hook",
  "dep:getrandom",
  "getrandom/wasm_js",
  "dep:serde-wasm-bindgen",
  "dep:tracing-subscriber-wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:wasm-streams",
  "dep:js-sys",
]
# 原生验证客户端：--no-default-features --features cli
# 原生验证客户端：--no-default-features --features cli
#
# 带上 sqlite —— 历史存储用它（只在原生侧；wasm 端不存历史，见 room.rs 的 HistoryStore）
cli = ["tokio/rt-multi-thread", "tokio/macros", "tokio/time", "dep:rusqlite"]

[dependencies]
anyhow = "1"
async-channel = "2"
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
# 直接依赖 noq-proto 是为了拿到拥塞控制器的配置（iroh 没有重导出 congestion 模块）。
# 用途：把默认的 CUBIC 换成 BBR3 并调大初始拥塞窗口 —— 见 room.rs 里传输层的注释。
noq-proto = "1.3"
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
blake3 = "1"
hex = "0.4"
tokio = { version = "1", default-features = false, features = ["sync"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 历史存储（只在原生 roomd 侧启用；`bundled` = 内置 SQLite 源码一起编译并静态链接，
# 运行时容器里不需要任何 SQLite 库。SQLite 是 public domain。）
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tracing-subscriber-wasm = { version = "0.1", optional = true }
wasm-bindgen = { version = "=0.2.122", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-streams = { version = "0.5", optional = true }

# wasm-opt 需要显式打开这些 wasm 特性，否则会失败（官方示例同款配置）
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-nontrapping-float-to-int", "--enable-bulk-memory", "--enable-reference-types"]

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"

[patch.crates-io]
iroh-gossip = { path = "vendor/iroh-gossip" }

[dev-dependencies]
rand = "0.10"
