[package]
name = "iroh-web"
version = "0.2.0"
edition = "2021"
description = "Browser (wasm) + native iroh endpoint for the editor.vip self-hosted relay fleet"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "relay-probe"
path = "src/bin/relay_probe.rs"
required-features = ["cli"]

[[bin]]
name = "filetest"
path = "src/bin/filetest.rs"
required-features = ["cli"]

[[bin]]
name = "roomtest"
path = "src/bin/roomtest.rs"
required-features = ["cli"]

[[bin]]
name = "roomd"
path = "src/bin/roomd.rs"
required-features = ["cli"]

# 无头命令行客户端：让没有浏览器/Node 的机器（CI、agent）也能作为成员进房收发。
[[bin]]
name = "agent"
path = "src/bin/agent.rs"
required-features = ["cli"]

[features]
# 默认构建 wasm（wasm-pack 用默认 feature）
default = ["wasm"]
wasm = [
  "dep:console_error_panic_hook",
  "dep:getrandom",
  "getrandom/wasm_js",
  "dep:serde-wasm-bindgen",
  "dep:tracing-subscriber-wasm",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:wasm-streams",
  "dep:js-sys",
]
# 原生验证客户端：--no-default-features --features cli
# 原生验证客户端：--no-default-features --features cli
#
# 带上 sqlite —— 历史存储用它（只在原生侧；wasm 端不存历史，见 room.rs 的 HistoryStore）
# tokio/signal：agent serve（行协议常驻）要处理 SIGTERM/SIGINT 的优雅退出。
# 它需要的 signal-hook-registry 早已在 Cargo.lock 里（间接依赖），所以 --locked 不受影响。
cli = ["tokio/rt-multi-thread", "tokio/macros", "tokio/time", "tokio/signal", "dep:rusqlite"]

# Android JNI 桥（src/jni_api.rs）。
#
# ⚠️ 为什么要有这个 feature，而不是只靠 `cfg(target_os = "android")`：
#    只按 target 判断的话，**在没有 NDK 的机器上这段代码永远不会被编译**，
#    于是"能不能编过"只能等 CI 才知道 —— 那是很糟的反馈回路。
#    加上这个 feature 就能在 macOS/Linux 上 `cargo check --features jni-bridge`
#    做**纯类型检查**（不链接、不需要 NDK），把语法/类型错误就地抓出来。
jni-bridge = ["dep:jni", "dep:ndk-context"]

[dependencies]
anyhow = "1"
async-channel = "2"
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
# 直接依赖 noq-proto 是为了拿到拥塞控制器的配置（iroh 没有重导出 congestion 模块）。
# 用途：把默认的 CUBIC 换成 BBR3 并调大初始拥塞窗口 —— 见 room.rs 里传输层的注释。
noq-proto = "1.3"
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
blake3 = "1"
hex = "0.4"
tokio = { version = "1", default-features = false, features = ["sync"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 历史存储（只在原生 roomd 侧启用；`bundled` = 内置 SQLite 源码一起编译并静态链接，
# 运行时容器里不需要任何 SQLite 库。SQLite 是 public domain。）
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
tracing-subscriber-wasm = { version = "0.1", optional = true }
wasm-bindgen = { version = "=0.2.122", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-streams = { version = "0.5", optional = true }

# Android JNI 桥（src/jni_api.rs）用，**optional**：
#   - 本地类型检查（无需 NDK）：`cargo check --no-default-features --features "cli jni-bridge"`
#   - Android 正式构建：构建脚本加 `--features jni-bridge`
#
# ⚠️ 两个踩过的坑（别改回去）：
#   1. feature 里的 `dep:jni` 要求它是**普通 optional 依赖**，不能只写在
#      `[target.'cfg(target_os = "android")'.dependencies]` 里（清单会直接报错）。
#   2. `[target...]` 表必须放在 `[dependencies]` **全部结束之后**：插在中间会把
#      后面的依赖（tracing-subscriber / rusqlite / wasm 全家）全吞成"仅 Android"。
# 版本无需下载新包：0.22.4 已在依赖树里（rustls-platform-verifier 带入）。
jni = { version = "0.22", optional = true }

# Android 上下文注入（src/jni_api.rs 的 nativeInitContext）。
#
# ⚠️ **不初始化它会 SIGABRT**，而且报错完全看不出原因：
#       Abort message: 'android context was not initialized'
#       #26 Java_…_IrohNative_nativeCreate+356
#   两台下游消费者都靠它：iroh 的 DNS 解析（读系统 nameserver）与
#   reqwest 的 TLS 校验（rustls-platform-verifier）。
#
# 为什么直接依赖它，而不是用 `iroh::dns::install_android_jni_context`：
#   后者带 `#[cfg(any(target_os = "android", doc))]`，在 macOS/Linux 上
#   **根本不存在** → 就没法在没真机的机器上做类型检查了。
#   `ndk-context` 没有 cfg 限制，本地 `cargo check` 就能挡住笔误。
#
# 版本无需新增包：0.1.1 早就在依赖树里（n0-dns-resolver / netdev 带入）。
ndk-context = { version = "0.1", optional = true }

# wasm-opt 需要显式打开这些 wasm 特性，否则会失败（官方示例同款配置）
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-nontrapping-float-to-int", "--enable-bulk-memory", "--enable-reference-types"]

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"

[patch.crates-io]
iroh-gossip = { path = "vendor/iroh-gossip" }

[dev-dependencies]
rand = "0.10"
serde_json = "1"
