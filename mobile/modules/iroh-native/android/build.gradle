// Android 模块的 Gradle 配置。
//
// ⚠️ 这里**没有**任何 Rust 编译逻辑 —— .so 是 CI 编好之后
//    下载到 `android/src/main/jniLibs/<abi>/libiroh_web.so` 的
//    （见 .github/workflows/build-android-so.yml）。
//
//    为什么不在 Gradle 里调 cargo：
//      1. Gradle 构建机上不一定有 Rust + NDK，装了也要多花十几分钟
//      2. 开发时改 JS 不该触发 Rust 重编（那会让热重载变成分钟级）
//      3. CI 编一次、所有开发者复用，产物还能缓存

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'vip.editor.irohchat.nativebridge'
version = '0.1.0'

android {
    namespace "vip.editor.irohchat.nativebridge"

    // 跟随根工程（android/build.gradle 里的 ext），与 app 用同一套版本 ——
    // 各写一份到时候升 SDK 会漏掉一个。
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion

        // ⚠️⚠️ `versionName` / `versionCode` **必须写**，即使这是 library 模块。
        //    `expo-module-gradle-plugin` 会读它们；不写的话配置阶段就失败：
        //        A problem occurred configuring project ':iroh-native'.
        //        > 'android.defaultConfig.versionName' is not defined
        //    （真实踩过：14 分钟的首次构建跑到这里才炸。）
        //    library 模块没有真正的版本号概念，写自己的版本即可。
        versionCode 1
        versionName "0.1.0"

        // 只要 arm64-v8a —— CI 只出这一个 ABI（见 build-android-so.yml 的说明），
        // 不声明的话 Gradle 会期望着 x86 等其它 ABI 的 .so 而报缺文件。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // ⚠️ jniLibs 是**默认**目录，本来不用写。这里显式声明是为了让
    //    "把 .so 放哪"这件事在代码里看得见 —— 漏放是这套集成最常见的失败。
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
